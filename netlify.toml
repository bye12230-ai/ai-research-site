[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"  # 可改成你本地 Node 版本

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
